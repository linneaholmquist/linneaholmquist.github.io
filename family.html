
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family | Linnea Holmquist</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* FAMILY PAGE HEADING */

        .family-heading {
            padding: 100px 8% 55px;
        }

        .family-heading h1 {
            margin-bottom: 18px;
        }

        .family-heading .family-intro {
            font-size: 18px;
            line-height: 1.7;
            max-width: 520px;
            color: #555;
        }

        /* PHOTO GALLERY */

        .family-gallery {
            padding: 20px 8% 120px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: 45px 30px;
        }

        .family-item {
            margin: 0;
            min-width: 0;
        }

        .family-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* WIDE PHOTOS */

        .family-item.wide {
            grid-column: span 2;
        }

        .family-item.wide img {
            max-height: 680px;
            object-fit: cover;
        }

        /* CAPTIONS */

        .family-item figcaption {
            padding: 13px 2px 0;
        }

        .family-item figcaption strong {
            display: block;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .family-item figcaption span {
            font-size: 13px;
            line-height: 1.6;
            color: #777;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .family-heading {
                padding: 70px 8% 40px;
            }

            .family-gallery {
                grid-template-columns: 1fr;
                padding: 10px 8% 80px;
                gap: 35px;
            }

            .family-item.wide {
                grid-column: span 1;
            }

            .family-item.wide img {
                max-height: none;
            }
        }
    </style>
</head>
